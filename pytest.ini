[pytest]
testpaths = tests
# Only files written for pytest. The other tests/*.py files are scripts
# (python -m tests.test_api, ...) and are run through tests/test_api_pytest.py.
python_files = *_pytest.py
markers =
    slow: needs the real database (and an LLM key for the eval sheet); run with  pytest -m slow
# Plain `pytest` stays fast and offline: slow tests are skipped unless asked for.
addopts = -m "not slow"
